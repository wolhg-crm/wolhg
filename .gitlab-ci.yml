stages:
  - test
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true
  # Used by GitLab SaaS Docker runners; ignored by shell executors.
  image: php:8.5-cli-bookworm

variables:
  GIT_DEPTH: "50"
  DEBIAN_FRONTEND: noninteractive

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------

.test_setup:
  before_script:
    - php -v
    - |
      set -e
      if ! command -v node >/dev/null 2>&1; then
        apt-get update -qq
        apt-get install -y -qq git unzip nodejs npm >/dev/null
      fi
      if ! command -v git >/dev/null 2>&1; then
        apt-get update -qq
        apt-get install -y -qq git >/dev/null
      fi
      if ! command -v lftp >/dev/null 2>&1; then
        apt-get update -qq
        apt-get install -y -qq lftp >/dev/null
      fi
      # php-ftp is optional now (transfers use lftp); keep Node available.
    - node -v
    - command -v lftp

test:
  stage: test
  extends: .test_setup
  script:
    - make test
    - DEPLOY_DRY_RUN=1 php scripts/deploy/ftp-deploy.php
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - tests/

# ---------------------------------------------------------------------------
# Production FTP — only files changed since remote .deploy-revision
# ---------------------------------------------------------------------------

deploy:ftp:
  stage: deploy
  extends: .test_setup
  resource_group: production-ftp
  needs: ["test"]
  environment:
    name: production
    url: https://wolhg.ru
  variables:
    DEPLOY_TO: "$CI_COMMIT_SHA"
  script:
    - test -n "$FTP_HOST"
    - test -n "$FTP_USER"
    - test -n "$FTP_PASSWORD"
    - test -n "$FTP_REMOTE_PATH"
    - php scripts/deploy/ftp-deploy.php
    - |
      set -e
      # Prefer explicit migrate endpoint; otherwise the next web hit runs migrate.auto.
      if [ -n "${MIGRATE_TOKEN:-}" ]; then
        BASE_URL="${MIGRATE_BASE_URL:-https://wolhg.ru}"
        echo "Running remote migrations via ${BASE_URL}/system/migrate"
        curl -fsS -X POST \
          -H "X-Migrate-Token: ${MIGRATE_TOKEN}" \
          -H "Content-Type: application/json" \
          "${BASE_URL}/system/migrate"
        echo
      else
        echo "MIGRATE_TOKEN not set — triggering migrate.auto via homepage request"
        curl -fsS -o /dev/null -w "%{http_code}\n" "${MIGRATE_BASE_URL:-https://wolhg.ru}/" || true
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  # Masked/protected CI/CD variables:
  #   FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_REMOTE_PATH, FTP_PORT
  # Optional: FTP_SSL=1, DEPLOY_FULL=1, MIGRATE_TOKEN, MIGRATE_BASE_URL
