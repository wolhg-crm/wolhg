services:
  app:
    build: .
    ports:
      - "8096:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    command: sh -c "while true; do php bin/send-notifications.php; php bin/send-emails.php; php bin/send-bot-notifications.php; sleep 60; done"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: church_care
      MYSQL_USER: church
      MYSQL_PASSWORD: church
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
